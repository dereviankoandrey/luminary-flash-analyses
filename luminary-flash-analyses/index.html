function renderMarkets(filter='all') {
  const list = document.getElementById('market-list');
  let filtered = markets;
  if (filter === 'go') filtered = markets.filter(m => m.type === 'GO');
  else if (filter === 'review') filtered = markets.filter(m => m.type === 'Review');
  else if (filter === 'texas') filtered = markets.filter(m => m.region === 'Texas');
  else if (filter === 'florida') filtered = markets.filter(m => m.region === 'Florida');

  list.innerHTML = filtered.map(m => `
    <div class="market-card" onclick="showDetail(${m.id})">
      <div class="market-header">
        <span class="market-name">${m.name}</span>
        <span class="market-region">${m.region} · ${m.type === 'GO' ? '🟢 GO' : m.type === 'Review' ? '🟡 Review' : ''}</span>
      </div>
      <div class="market-metrics">
        <div class="metric"><div class="val">${m.popGrowth}%</div><div class="label">Pop Growth</div></div>
        <div class="metric"><div class="val">${m.yieldCap}%</div><div class="label">Yld Cap</div></div>
        <div class="metric"><div class="val">${m.affordability}</div><div class="label">Afford Index</div></div>

function showDetail(id) {
  const m = markets.find(x => x.id === id);
  if (!m || !detailData[id]) return;
  const d = detailData[id];
  document.getElementById('detail-content').innerHTML = `
    <h2 style="color:#fff;margin-bottom:.5rem">${m.name}</h2>
    <div class="signal-box"><h3>🔍 Signal</h3><p>${d.s}</p></div>
    <table class="deal-table">
      <tr><th>Type</th><th>Purchase</th><th>Down (20%)</th><th>Mo Cash Flow</th><th>MOH Rate</th><th>Cap Rate</th></tr>
      ${d.deals.map(d => `<tr><td>${d.t}</td><td>$${d.p.toLocaleString()}</td><td>$${d.d.toLocaleString()}</td><td style="color:#3fb950;font-weight:600">$${d.c}/mo</td><td>${d.mh}</td><td>${d.cr}</td></tr>`).join('')}
    </table>
  `;
  document.getElementById('detail-panel').classList.add('visible');
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');

function filterMarkets(f) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
